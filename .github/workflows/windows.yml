name: windows-2025-postgresql-reproduction

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL 17
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $service = Get-Service -Name postgresql-x64-17
          Set-Service -Name $service.Name -StartupType Manual
          Start-Service -Name $service.Name
          $psql = Join-Path $env:PGBIN 'psql.exe'
          & $psql --version
          if ($LASTEXITCODE -ne 0) {
            throw 'psql version command failed'
          }

      - name: Run independent Windows gate
        shell: pwsh
        run: |
          ./scripts/windows_gate.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -EvidenceRoot (Join-Path $env:RUNNER_TEMP 'ale-evidence')

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-2025-evidence
          path: ${{ runner.temp }}/ale-evidence
          if-no-files-found: error
          retention-days: 30
